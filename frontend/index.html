<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Travel Advisor — India</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>

<style>
/* ─── DESIGN TOKENS ─── */
:root {
  --ink:       #0e0e0c;
  --ink2:      #1c1c18;
  --ink3:      #2a2a24;
  --muted:     #6b6b60;
  --faint:     #c4c4b0;
  --paper:     #f5f3ee;
  --paper2:    #eeece6;
  --paper3:    #e5e3db;
  --gold:      #b8924a;
  --gold2:     #d4a855;
  --gold-pale: #f5ead8;
  --red:       #c0392b;
  --green:     #2d6a4f;
  --teal:      #1a6b6b;
  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;
  --radius:    6px;
  --shadow:    0 2px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ─── NOISE TEXTURE ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 0;
}

/* ─── LAYOUT ─── */
.app { position: relative; z-index: 1; }

/* ─── HEADER ─── */
header {
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
  padding: 18px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(14,14,12,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.logo-word {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.02em;
  color: var(--paper);
}
.logo-dot {
  width: 5px; height: 5px;
  background: var(--gold);
  border-radius: 50%;
  margin-bottom: 2px;
}

.nav-tabs {
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 3px;
}
.nav-tab {
  padding: 7px 18px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
  font-family: var(--sans);
  letter-spacing: 0.01em;
}
.nav-tab:hover { color: var(--paper); }
.nav-tab.active {
  background: rgba(255,255,255,0.1);
  color: var(--paper);
}

/* ─── HERO ─── */
.hero {
  padding: 80px 40px 60px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(184,146,74,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}
.hero-title {
  font-family: var(--serif);
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--paper);
  margin-bottom: 8px;
}
.hero-title em {
  font-style: italic;
  color: var(--gold2);
}
.hero-sub {
  font-size: 15px;
  color: var(--muted);
  font-weight: 300;
  margin-top: 16px;
}

/* ─── MAIN CONTENT ─── */
.main { max-width: 1100px; margin: 0 auto; padding: 0 40px 80px; }

/* ─── FORM PANEL ─── */
.form-panel {
  background: var(--ink2);
  border: 0.5px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 36px;
  margin-bottom: 32px;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.form-grid-wide { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field label {
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.field select,
.field input[type="number"],
.field input[type="text"] {
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--paper);
  outline: none;
  transition: border-color 0.2s;
  appearance: none;
  -webkit-appearance: none;
}
.field select:focus,
.field input:focus {
  border-color: var(--gold);
}

/* ─── PILL SELECTOR ─── */
.pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  padding: 7px 14px;
  border-radius: 100px;
  font-size: 12.5px;
  border: 0.5px solid rgba(255,255,255,0.12);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
  background: transparent;
  font-family: var(--sans);
  user-select: none;
}
.pill:hover { border-color: var(--gold); color: var(--paper); }
.pill.selected {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
  font-weight: 500;
}

/* ─── SUBMIT BUTTON ─── */
.btn-submit {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  background: var(--gold);
  color: var(--ink);
  border: none;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-submit:hover { background: var(--gold2); transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ─── LOADING ─── */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,0.2);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── RESULTS ─── */
.results-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 24px;
}
.results-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  letter-spacing: -0.01em;
}
.results-count {
  font-size: 12px;
  font-family: var(--mono);
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* AI Summary Card */
.ai-summary {
  background: linear-gradient(135deg, rgba(184,146,74,0.1) 0%, rgba(184,146,74,0.04) 100%);
  border: 0.5px solid rgba(184,146,74,0.25);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 28px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.ai-icon {
  width: 32px; height: 32px;
  background: var(--gold);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
}
.ai-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--faint);
}
.ai-label {
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

/* Destination Cards Grid */
.dest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.dest-card {
  background: var(--ink2);
  border: 0.5px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 24px;
  transition: all 0.2s;
  cursor: pointer;
  animation: fadeUp 0.4s ease both;
  position: relative;
  overflow: hidden;
}
.dest-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.dest-card:hover { border-color: rgba(184,146,74,0.3); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.dest-card:hover::before { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.dest-card:nth-child(2) { animation-delay: 0.07s; }
.dest-card:nth-child(3) { animation-delay: 0.14s; }
.dest-card:nth-child(4) { animation-delay: 0.21s; }
.dest-card:nth-child(5) { animation-delay: 0.28s; }

.dest-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.dest-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--paper);
  line-height: 1.2;
}
.dest-state { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

.rating-badge {
  background: rgba(184,146,74,0.15);
  border: 0.5px solid rgba(184,146,74,0.3);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--gold2);
  white-space: nowrap;
}

.dest-type-tag {
  display: inline-block;
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 0.5px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 3px 10px;
  margin-bottom: 14px;
}

.dest-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat-val { font-size: 14px; color: var(--faint); }

.highlights {
  border-top: 0.5px solid rgba(255,255,255,0.06);
  padding-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.highlight-tag {
  font-size: 11.5px;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  padding: 3px 8px;
}

/* Trip Summary Bar */
.trip-summary {
  background: var(--ink2);
  border: 0.5px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 20px 24px;
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
}
.trip-stat { display: flex; flex-direction: column; gap: 4px; }
.trip-stat-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.trip-stat-val { font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--paper); }

/* ─── CHAT ─── */
.chat-wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  height: 600px;
  background: var(--ink2);
  border: 0.5px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  overflow: hidden;
}
.chat-header {
  padding: 20px 24px;
  border-bottom: 0.5px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  gap: 12px;
}
.chat-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.chat-title { font-size: 15px; font-weight: 500; }
.chat-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: 440px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
}

.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.msg-avatar.ai { background: rgba(184,146,74,0.2); color: var(--gold); }
.msg-avatar.user { background: rgba(255,255,255,0.08); color: var(--faint); }

.msg-bubble {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.65;
}
.msg-bubble.ai {
  background: rgba(255,255,255,0.05);
  border: 0.5px solid rgba(255,255,255,0.07);
  color: var(--faint);
  border-radius: 4px 12px 12px 12px;
}
.msg-bubble.user {
  background: var(--gold);
  color: var(--ink);
  font-weight: 400;
  border-radius: 12px 4px 12px 12px;
}

.typing-indicator {
  display: flex; gap: 4px; padding: 4px 0; align-items: center;
}
.typing-dot {
  width: 6px; height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.2s ease infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

.follow-ups {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.follow-up-btn {
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 100px;
  border: 0.5px solid rgba(184,146,74,0.3);
  color: var(--gold2);
  background: rgba(184,146,74,0.05);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--sans);
}
.follow-up-btn:hover { background: rgba(184,146,74,0.15); }

.chat-input-row {
  padding: 16px 24px;
  border-top: 0.5px solid rgba(255,255,255,0.07);
  display: flex;
  gap: 10px;
  align-items: center;
}
.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 11px 16px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--paper);
  outline: none;
  transition: border-color 0.2s;
}
.chat-input::placeholder { color: var(--muted); }
.chat-input:focus { border-color: var(--gold); }

.btn-send {
  width: 40px; height: 40px;
  background: var(--gold);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-send:hover { background: var(--gold2); }
.btn-send svg { width: 16px; height: 16px; fill: var(--ink); }

/* ─── DESTINATIONS TAB ─── */
.dest-browser {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-pill {
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 12.5px;
  border: 0.5px solid rgba(255,255,255,0.1);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
  font-family: var(--sans);
}
.filter-pill.active { border-color: var(--gold); color: var(--gold); background: rgba(184,146,74,0.08); }

/* ─── EMPTY / ERROR STATES ─── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
.empty-title { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--faint); margin-bottom: 8px; }
.empty-sub { font-size: 13px; }

.error-banner {
  background: rgba(192,57,43,0.1);
  border: 0.5px solid rgba(192,57,43,0.3);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13.5px;
  color: #e87766;
  margin-bottom: 20px;
}

/* ─── OFFLINE DEMO NOTICE ─── */
.demo-notice {
  background: rgba(184,146,74,0.08);
  border: 0.5px solid rgba(184,146,74,0.2);
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 12.5px;
  color: var(--gold2);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  header { padding: 14px 20px; }
  .hero { padding: 50px 20px 40px; }
  .main { padding: 0 20px 60px; }
  .form-panel { padding: 24px 20px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid-wide { grid-template-columns: 1fr; }
  .nav-tabs { display: none; }
}
</style>
</head>
<body>
<div class="app" id="root"></div>

<script>
// ─── CONSTANTS ─────────────────────────────────────────────
const API = 'http://localhost:8000/api/v1';

// Demo data (used when backend not running)
const DEMO_DESTINATIONS = [
  { name:'Goa', state:'Goa', place_type:'Beach', rating:4.5, avg_budget_per_day:3, safety_index:4.2, best_season:'Nov – Feb', highlights:['Baga Beach','Dudhsagar Falls','Old Goa Churches','Nightlife'], why_recommended:'Perfect for friends with relaxation & nature interests' },
  { name:'Manali', state:'Himachal Pradesh', place_type:'Hill Station', rating:4.6, avg_budget_per_day:2, safety_index:4.0, best_season:'Oct – June', highlights:['Rohtang Pass','Solang Valley','River Rafting','Old Manali'], why_recommended:'Adventure capital — matches your interests perfectly' },
  { name:'Leh-Ladakh', state:'Ladakh', place_type:'Adventure', rating:4.8, avg_budget_per_day:4, safety_index:3.9, best_season:'June – Sep', highlights:['Pangong Lake','Nubra Valley','Khardung La','Monasteries'], why_recommended:'The ultimate adventure destination in India' },
  { name:'Rishikesh', state:'Uttarakhand', place_type:'Spiritual', rating:4.4, avg_budget_per_day:1, safety_index:4.3, best_season:'Sep – June', highlights:['River Rafting','Laxman Jhula','Beatles Ashram','Yoga Centers'], why_recommended:'Best budget-friendly adventure + nature destination' },
  { name:'Darjeeling', state:'West Bengal', place_type:'Hill Station', rating:4.5, avg_budget_per_day:2, safety_index:4.1, best_season:'Mar – May', highlights:['Tiger Hill Sunrise','Toy Train','Tea Gardens','Peace Pagoda'], why_recommended:'Perfect nature escape for couples and nature lovers' },
];

const ALL_DESTINATIONS = [
  ...DEMO_DESTINATIONS,
  { name:'Jaipur', state:'Rajasthan', place_type:'Historical', rating:4.4, avg_budget_per_day:2, safety_index:3.8, best_season:'Oct – Mar', highlights:['Amber Fort','Hawa Mahal','City Palace','Johari Bazaar'], why_recommended:'Best for culture & history lovers' },
  { name:'Kerala', state:'Kerala', place_type:'Backwater', rating:4.7, avg_budget_per_day:4, safety_index:4.5, best_season:'Sep – Mar', highlights:['Houseboat Stay','Backwater Cruise','Ayurvedic Spas','Marari Beach'], why_recommended:'Ideal romantic escape for couples' },
  { name:'Udaipur', state:'Rajasthan', place_type:'Heritage', rating:4.6, avg_budget_per_day:3, safety_index:4.0, best_season:'Sep – Mar', highlights:['Lake Pichola','City Palace','Jag Mandir','Sajjangarh'], why_recommended:'Most romantic heritage destination in India' },
];

// ─── STATE ─────────────────────────────────────────────────
let state = {
  tab: 'recommend', // recommend | chat | destinations
  loading: false,
  error: null,
  results: null,
  interests: [],
  chatMessages: [{ role:'assistant', content:"Namaste! 🙏 I'm TravelGuru, your personal India travel advisor. Ask me anything — best places for your budget, what to eat, when to visit, hidden gems, safety tips — I'm here to help you plan the perfect trip!", followUps:['Best places for adventure?','Where should a couple go?','Budget trip under ₹2k/day?'] }],
  chatInput: '',
  chatLoading: false,
  destFilter: 'All',
  isDemo: false
};

// ─── RENDER ─────────────────────────────────────────────────
function render() {
  document.getElementById('root').innerHTML = `
    <div class="app">
      ${renderHeader()}
      ${renderHero()}
      <div class="main">
        ${state.isDemo ? `<div class="demo-notice">⚡ Demo mode — backend not connected. Showing sample data. Start backend: <code style="font-family:var(--mono);font-size:11px">uvicorn main:app --reload</code></div>` : ''}
        ${state.tab === 'recommend'    ? renderRecommendTab()    : ''}
        ${state.tab === 'chat'        ? renderChatTab()         : ''}
        ${state.tab === 'destinations'? renderDestinationsTab() : ''}
      </div>
    </div>
  `;
  bindEvents();
  if (state.tab === 'chat') scrollChat();
}

// ─── HEADER ────────────────────────────────────────────────
function renderHeader() {
  const tabs = ['recommend','chat','destinations'];
  const labels = { recommend:'Recommend', chat:'Chat', destinations:'Explore' };
  return `
  <header>
    <div class="logo">
      <span class="logo-word">TravelGuru</span>
      <div class="logo-dot"></div>
    </div>
    <div class="nav-tabs">
      ${tabs.map(t => `<button class="nav-tab ${state.tab===t?'active':''}" data-tab="${t}">${labels[t]}</button>`).join('')}
    </div>
  </header>`;
}

// ─── HERO ──────────────────────────────────────────────────
function renderHero() {
  const heroText = {
    recommend: { eyebrow:'AI-Powered Planning', title:'Find Your Perfect <em>Destination</em>', sub:'Tell us your preferences — we\'ll find the ideal match' },
    chat:      { eyebrow:'Conversational AI', title:'Ask <em>Anything</em> About India', sub:'Your personal travel advisor, available 24/7' },
    destinations:{ eyebrow:'Curated Collection', title:'Explore <em>India</em>', sub:'Hand-picked destinations across the country' },
  }[state.tab];
  return `
  <div class="hero">
    <div class="hero-eyebrow">${heroText.eyebrow}</div>
    <h1 class="hero-title">${heroText.title}</h1>
    <p class="hero-sub">${heroText.sub}</p>
  </div>`;
}

// ─── RECOMMEND TAB ─────────────────────────────────────────
function renderRecommendTab() {
  const interests = ['Culture','Adventure','Relaxation','Nature','Food','Spiritual'];
  return `
  <div class="form-panel">
    <div class="form-grid">
      <div class="field">
        <label>Budget (₹k/day)</label>
        <input type="number" id="budget" value="3" min="1" max="100" placeholder="e.g. 3"/>
      </div>
      <div class="field">
        <label>Duration (days)</label>
        <input type="number" id="duration" value="5" min="1" max="30" placeholder="e.g. 5"/>
      </div>
      <div class="field">
        <label>Season</label>
        <select id="season">
          <option value="Winter">Winter (Oct–Feb)</option>
          <option value="Summer">Summer (Mar–May)</option>
          <option value="Monsoon">Monsoon (Jun–Aug)</option>
          <option value="Autumn">Autumn (Sep)</option>
        </select>
      </div>
    </div>
    <div class="form-grid-wide">
      <div class="field">
        <label>Travelling with</label>
        <select id="companions">
          <option value="Friends">Friends</option>
          <option value="Solo">Solo</option>
          <option value="Couple">Couple</option>
          <option value="Family">Family</option>
        </select>
      </div>
      <div class="field">
        <label>Place type (optional)</label>
        <select id="place_type">
          <option value="">Any type</option>
          <option value="Beach">Beach</option>
          <option value="Hill Station">Hill Station</option>
          <option value="Historical">Historical</option>
          <option value="Adventure">Adventure</option>
          <option value="Spiritual">Spiritual</option>
          <option value="Heritage">Heritage</option>
          <option value="Backwater">Backwater</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:20px">
      <label>Interests (select all that apply)</label>
      <div class="pill-group">
        ${interests.map(i => `<span class="pill ${state.interests.includes(i)?'selected':''}" data-interest="${i}">${i}</span>`).join('')}
      </div>
    </div>
    <button class="btn-submit" id="btn-recommend" ${state.loading?'disabled':''}>
      ${state.loading ? '<div class="spinner"></div> Finding destinations...' : '→ Find My Perfect Trip'}
    </button>
  </div>

  ${state.error ? `<div class="error-banner">⚠ ${state.error}</div>` : ''}
  ${state.results ? renderResults() : renderEmptyState()}
  `;
}

function renderEmptyState() {
  return `
  <div class="empty-state">
    <div class="empty-icon">🗺️</div>
    <div class="empty-title">Your recommendations will appear here</div>
    <div class="empty-sub">Fill in your preferences above and click Find My Perfect Trip</div>
  </div>`;
}

function renderResults() {
  const r = state.results;
  return `
  <div>
    <div class="results-header">
      <div class="results-title">Your Recommendations</div>
      <div class="results-count">${r.destinations.length} destinations found</div>
    </div>

    ${r.ai_summary ? `
    <div class="ai-summary">
      <div class="ai-icon">✦</div>
      <div>
        <div class="ai-label">AI Insight</div>
        <div class="ai-text">${r.ai_summary}</div>
      </div>
    </div>` : ''}

    <div class="dest-grid">
      ${r.destinations.map(d => renderDestCard(d)).join('')}
    </div>

    <div class="trip-summary">
      <div class="trip-stat">
        <div class="trip-stat-label">Est. Total Cost</div>
        <div class="trip-stat-val">₹${r.total_estimated_cost}k</div>
      </div>
      <div class="trip-stat">
        <div class="trip-stat-label">Best Time</div>
        <div class="trip-stat-val" style="font-size:16px">${r.best_time_to_visit}</div>
      </div>
      ${r.packing_tips && r.packing_tips.length ? `
      <div class="trip-stat">
        <div class="trip-stat-label">Packing Tip</div>
        <div class="trip-stat-val" style="font-size:14px;color:var(--faint)">${r.packing_tips[0]}</div>
      </div>` : ''}
    </div>
  </div>`;
}

function renderDestCard(d) {
  return `
  <div class="dest-card">
    <div class="dest-header">
      <div>
        <div class="dest-name">${d.name}</div>
        <div class="dest-state">${d.state}</div>
      </div>
      <div class="rating-badge">★ ${d.rating}</div>
    </div>
    <div class="dest-type-tag">${d.place_type}</div>
    <div class="dest-stats">
      <div class="stat">
        <div class="stat-label">Budget/day</div>
        <div class="stat-val">₹${d.avg_budget_per_day}k–${d.avg_budget_per_day+2}k</div>
      </div>
      <div class="stat">
        <div class="stat-label">Safety</div>
        <div class="stat-val">${d.safety_index}/5.0</div>
      </div>
      <div class="stat" style="grid-column:1/-1">
        <div class="stat-label">Best Season</div>
        <div class="stat-val">${d.best_season}</div>
      </div>
    </div>
    <div class="highlights">
      ${(d.highlights||[]).slice(0,4).map(h=>`<span class="highlight-tag">${h}</span>`).join('')}
    </div>
  </div>`;
}

// ─── CHAT TAB ──────────────────────────────────────────────
function renderChatTab() {
  return `
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="chat-avatar">✦</div>
      <div>
        <div class="chat-title">TravelGuru AI</div>
        <div class="chat-status"><span class="status-dot"></span> Online</div>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages">
      ${state.chatMessages.map((m,i) => renderMsg(m, i)).join('')}
      ${state.chatLoading ? `
      <div class="msg">
        <div class="msg-avatar ai">✦</div>
        <div class="msg-bubble ai"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
      </div>` : ''}
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" type="text" placeholder="Ask about any destination..." value="${state.chatInput}" />
      <button class="btn-send" id="btn-send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>`;
}

function renderMsg(m, idx) {
  const isUser = m.role === 'user';
  const isLast = idx === state.chatMessages.length - 1;
  return `
  <div class="msg ${isUser?'user':''}">
    <div class="msg-avatar ${isUser?'user':'ai'}">${isUser?'You':'✦'}</div>
    <div>
      <div class="msg-bubble ${isUser?'user':'ai'}">${m.content}</div>
      ${!isUser && m.followUps && isLast ? `
      <div class="follow-ups">
        ${m.followUps.map(q=>`<button class="follow-up-btn" data-q="${q}">${q}</button>`).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

// ─── DESTINATIONS TAB ──────────────────────────────────────
function renderDestinationsTab() {
  const types = ['All','Beach','Hill Station','Historical','Adventure','Spiritual','Heritage','Backwater'];
  const filtered = state.destFilter === 'All'
    ? ALL_DESTINATIONS
    : ALL_DESTINATIONS.filter(d => d.place_type === state.destFilter);
  return `
  <div>
    <div class="filter-row">
      ${types.map(t=>`<button class="filter-pill ${state.destFilter===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}
    </div>
    <div class="dest-browser">
      ${filtered.map(d=>renderDestCard(d)).join('')}
    </div>
  </div>`;
}

// ─── EVENTS ─────────────────────────────────────────────────
function bindEvents() {
  // Nav tabs
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => { state.tab = el.dataset.tab; render(); });
  });

  // Interest pills
  document.querySelectorAll('[data-interest]').forEach(el => {
    el.addEventListener('click', () => {
      const i = el.dataset.interest;
      if (state.interests.includes(i)) state.interests = state.interests.filter(x=>x!==i);
      else state.interests.push(i);
      render();
    });
  });

  // Recommend button
  const btnRec = document.getElementById('btn-recommend');
  if (btnRec) btnRec.addEventListener('click', doRecommend);

  // Chat
  const inp = document.getElementById('chat-input');
  const btnSend = document.getElementById('btn-send');
  if (inp) {
    inp.addEventListener('input', e => { state.chatInput = e.target.value; });
    inp.addEventListener('keydown', e => { if (e.key==='Enter') doChat(); });
  }
  if (btnSend) btnSend.addEventListener('click', doChat);

  // Follow-up buttons
  document.querySelectorAll('[data-q]').forEach(el => {
    el.addEventListener('click', () => { state.chatInput = el.dataset.q; doChat(); });
  });

  // Destination filters
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener('click', () => { state.destFilter = el.dataset.filter; render(); });
  });
}

// ─── API CALLS ──────────────────────────────────────────────
async function doRecommend() {
  if (state.interests.length === 0) {
    state.error = 'Please select at least one interest.';
    render(); return;
  }
  state.loading = true;
  state.error = null;
  state.results = null;
  render();

  const body = {
    budget_per_day: parseInt(document.getElementById('budget')?.value || 3),
    duration_days:  parseInt(document.getElementById('duration')?.value || 5),
    companions: document.getElementById('companions')?.value || 'Friends',
    interests:  state.interests,
    season:     document.getElementById('season')?.value || 'Winter',
    min_safety: 3.0,
  };
  const pt = document.getElementById('place_type')?.value;
  if (pt) body.place_type = pt;

  try {
    const res = await fetch(`${API}/recommend`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`API error ${res.status}`);
    state.results = await res.json();
    state.isDemo = false;
  } catch(e) {
    // Demo mode fallback
    state.isDemo = true;
    state.results = {
      destinations: DEMO_DESTINATIONS.slice(0,4),
      ai_summary: 'Based on your preferences, these destinations offer the perfect mix of adventure and natural beauty. Each location has been selected for its safety record, budget-friendliness, and alignment with your interests.',
      total_estimated_cost: body.budget_per_day * body.duration_days,
      best_time_to_visit: body.season === 'Winter' ? 'October to February' : 'March to June',
      packing_tips: ['Pack light layers for hill stations','Always carry a portable charger','Download offline maps before you leave']
    };
  }
  state.loading = false;
  render();
}

async function doChat() {
  const msg = state.chatInput.trim();
  if (!msg || state.chatLoading) return;
  state.chatMessages.push({ role:'user', content: msg });
  state.chatInput = '';
  state.chatLoading = true;
  render();

  const history = state.chatMessages.slice(0,-1).map(m=>({ role:m.role, content:m.content }));

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ message:msg, conversation_history:history }),
    });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    state.chatMessages.push({ role:'assistant', content:data.reply, followUps:data.follow_up_questions || [] });
    state.isDemo = false;
  } catch(e) {
    // Demo fallback responses
    const demos = {
      default: "Great question! India has incredible diversity. For adventure lovers, Ladakh and Manali are top picks. For beaches, Goa is unbeatable November–February. On a tight budget, Rishikesh gives you the most value — yoga, rafting, and mountain views for under ₹1k/day.",
      adventure: "For adventure, I'd recommend Leh-Ladakh (the ultimate), Manali (Rohtang Pass + rafting), or Rishikesh (white-water rafting on the Ganga). Each offers a completely different experience!",
      budget: "On ₹1-2k/day, Rishikesh and Varanasi are your best bets — spiritual, beautiful, and incredibly affordable. Manali and Darjeeling are also doable at ₹2k/day if you stay in hostels.",
    };
    const lower = msg.toLowerCase();
    const reply = lower.includes('adventure') ? demos.adventure : lower.includes('budget') ? demos.budget : demos.default;
    state.chatMessages.push({ role:'assistant', content:reply, followUps:['Tell me about Ladakh','Best food in India?','Is Goa safe for solo travel?'] });
    state.isDemo = true;
  }
  state.chatLoading = false;
  render();
}

function scrollChat() {
  const el = document.getElementById('chat-messages');
  if (el) el.scrollTop = el.scrollHeight;
}

// ─── BOOT ───────────────────────────────────────────────────
render();
</script>
</body>
</html>
